<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cell Tower Finder</title>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
        }

        /* Map fills entire screen */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay container allows zooming/panning through it */
        .panel-overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            pointer-events: none;
            padding: 10px;
        }

        /* Fixed Black Panel Card */
        .status-panel {
            pointer-events: auto;
            background: rgba(18, 24, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 14px;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            max-width: 600px;
            margin: 0 auto;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .tower-id-tag {
            color: #38bdf8;
            font-family: monospace;
        }

        .connection-status {
            font-size: 12px;
            color: #4ade80;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px #4ade80;
        }

        .location-info {
            font-size: 11px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
        }

        .coords {
            font-family: monospace;
            background: rgba(255, 255, 255, 0.08);
            padding: 1px 5px;
            border-radius: 4px;
            color: #38bdf8;
        }

        .auto-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }
        
        .auto-btn:active {
            background: #334155;
        }
    </style>
</head>
<body>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Fixed Header Overlay Panel -->
    <div class="panel-overlay-container">
        <div class="status-panel">
            <div class="panel-header">
                <span>📶 Cell Tower Finder</span>
                <button class="auto-btn" id="locateBtn">My Location</button>
            </div>
            <div class="connection-status">
                <span class="status-dot"></span> <span id="connText">CONNECTING TO GPS...</span>
            </div>
            <div class="location-info">
                <span id="locName">📍 Acquiring location...</span>
                <span class="coords" id="coordText">--.----°, --.----°</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map (default fallback center)
        const map = L.map('map', { zoomControl: false }).setView([17.2326, 78.5899], 15);

        // Add Zoom control to bottom right so it doesn't clash with top panel
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // OpenStreetMap Tile Layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = null;
        let accuracyCircle = null;

        // Function to update position on map & panel
        function updatePosition(lat, lng, accuracy) {
            map.setView([lat, lng], 16);

            if (marker) {
                marker.setLatLng([lat, lng]);
                accuracyCircle.setLatLng([lat, lng]);
                accuracyCircle.setRadius(accuracy || 30);
            } else {
                marker = L.marker([lat, lng]).addTo(map)
                    .bindPopup("<b>Current Location</b>").openPopup();
                accuracyCircle = L.circle([lat, lng], { radius: accuracy || 30, color: '#38bdf8', fillOpacity: 0.15 }).addTo(map);
            }

            // Update panel text
            document.getElementById('coordText').innerText = `${lat.toFixed(4)}°, ${lng.toFixed(4)}°`;
            document.getElementById('connText').innerText = `CONNECTED: Active GPS Tracking`;
            document.getElementById('locName').innerText = `📍 Live Location (Accuracy: ~${Math.round(accuracy || 0)}m)`;
        }

        // Request user browser geolocation on load for travel tracking
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    updatePosition(lat, lng, accuracy);
                },
                (error) => {
                    console.warn("Geolocation error or permission denied:", error.message);
                    document.getElementById('connText').innerText = `GPS ERROR - Using Default Zone`;
                    document.getElementById('locName').innerText = `📍 Default View`;
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 10000,
                    timeout: 15000
                }
            );
        } else {
            alert("Geolocation is not supported by your browser.");
        }

        // Button to manually re-center on current position
        document.getElementById('locateBtn').addEventListener('click', () => {
            navigator.geolocation.getCurrentPosition((position) => {
                updatePosition(position.coords.latitude, position.coords.longitude, position.coords.accuracy);
            });
        });
    </script>
</body>
</html>
