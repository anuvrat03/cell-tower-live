<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cell Tower Finder</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f0f0;
        }

        /* Direct full screen map view */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay container for status panel */
        .panel-overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            pointer-events: none; /* Allows touch to pass through to map */
            padding: 12px;
        }

        /* Fixed Black Header Panel */
        .status-panel {
            pointer-events: auto; /* Enables clicking panel buttons */
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            max-width: 600px;
            margin: 0 auto;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .connection-status {
            font-size: 12px;
            color: #4ade80;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #4ade80;
        }

        .location-info {
            font-size: 11px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
        }

        .coords {
            font-family: monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: #38bdf8;
        }

        .locate-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .locate-btn:active {
            background: #334155;
        }
    </style>
</head>
<body>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Fixed Header Overlay Panel -->
    <div class="panel-overlay-container">
        <div class="status-panel">
            <div class="panel-header">
                <span>📶 Cell Tower Finder</span>
                <button class="locate-btn" id="recenterBtn">My Location</button>
            </div>
            <div class="connection-status">
                <span class="status-dot"></span> <span id="statusText">LOADING MAP TILES...</span>
            </div>
            <div class="location-info">
                <span id="locationText">📍 Initializing view...</span>
                <span class="coords" id="coordsText">17.2326°, 78.5899°</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Fallback coordinates (Bongulur region)
        const defaultLat = 17.2326;
        const defaultLng = 78.5899;

        // Initialize Map immediately
        const map = L.map('map', { zoomControl: false }).setView([defaultLat, defaultLng], 15);

        // Add Zoom controls at the bottom right
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Add OpenStreetMap tile layer
        const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let userMarker = null;
        let accuracyCircle = null;
        let isFirstGPSFix = true;

        function updateView(lat, lng, accuracy, sourceText) {
            if (isFirstGPSFix) {
                map.setView([lat, lng], 16);
                isFirstGPSFix = false;
            }

            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
                accuracyCircle.setLatLng([lat, lng]);
                accuracyCircle.setRadius(accuracy || 25);
            } else {
                userMarker = L.marker([lat, lng]).addTo(map)
                    .bindPopup("<b>Current Location</b>");
                accuracyCircle = L.circle([lat, lng], { 
                    radius: accuracy || 25, 
                    color: '#38bdf8', 
                    fillColor: '#38bdf8', 
                    fillOpacity: 0.2 
                }).addTo(map);
            }

            document.getElementById('statusText').innerText = "LIVE GPS CONNECTED";
            document.getElementById('locationText').innerText = `📍 ${sourceText} (~${Math.round(accuracy || 0)}m)`;
            document.getElementById('coordsText').innerText = `${lat.toFixed(4)}°, ${lng.toFixed(4)}°`;
        }

        // Try to get GPS position immediately, fallback gracefully to default view if blocked
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    updateView(position.coords.latitude, position.coords.longitude, position.coords.accuracy, "Travel GPS Active");
                },
                (error) => {
                    console.warn("Initial GPS lock failed:", error.message);
                    document.getElementById('statusText').innerText = "USING DEFAULT VIEW";
                    document.getElementById('locationText').innerText = "📍 Tap 'My Location' to enable GPS";
                },
                { timeout: 8000, enableHighAccuracy: true }
            );

            // Continuously watch position as you travel
            navigator.geolocation.watchPosition(
                (position) => {
                    updateView(position.coords.latitude, position.coords.longitude, position.coords.accuracy, "Travel GPS Active");
                },
                null,
                { enableHighAccuracy: true, maximumAge: 5000 }
            );
        } else {
            document.getElementById('statusText').innerText = "GPS NOT SUPPORTED";
        }

        // Force map resize check to guarantee tiles render properly
        window.addEventListener('load', () => {
            map.invalidateSize();
        });
        setTimeout(() => {
            map.invalidateSize();
        }, 500);

        // Re-center button click handler
        document.getElementById('recenterBtn').addEventListener('click', () => {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    map.setView([pos.coords.latitude, pos.coords.longitude], 16);
                    updateView(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, "Re-centered");
                }, () => {
                    alert("Please ensure location permissions are enabled in your browser settings.");
                }, { enableHighAccuracy: true });
            }
        });
    </script>
</body>
</html>
