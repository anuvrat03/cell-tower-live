<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cell Tower Finder</title>
  <meta name="theme-color" content="#0a0e17">
  <!-- Leaflet CSS & JS CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --bg-dark: #0a0e17;
      --surface: #151d2a;
      --surface-border: #2d3748;
      --neon-connected: #00FF66;
      --user-blue: #0284c7;
      --user-blue-glow: #38bdf8;
    }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: #ffffff;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Map Viewport - Full Screen */
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background: #e2e8f0;
    }

    /* Fixed Top Header Panel (Comfortable Touch & Reading View) */
    .top-panel-container {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      pointer-events: none;
    }

    .top-panel {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      max-width: 650px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cell-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .cell-input {
      flex: 1;
      background: #090d16;
      border: 1px solid #334155;
      color: #ffffff;
      font-family: monospace;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      outline: none;
    }

    .cell-input:focus {
      border-color: var(--neon-connected);
    }

    .btn-quick {
      background: #1e293b;
      border: 1px solid #475569;
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .status-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      padding-top: 2px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--neon-connected);
    }

    .dot-pulse {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--neon-connected);
      box-shadow: 0 0 10px var(--neon-connected);
      display: inline-block;
    }

    /* Connected Neon Green Marker Animation */
    .connected-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .connected-core {
      width: 32px;
      height: 32px;
      background: #090d16;
      border: 3px solid #00FF66;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px #00FF66;
    }

    .ripple-ring {
      position: absolute;
      top: -12px;
      left: -12px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #00FF66;
      pointer-events: none;
      animation: ripple-grow 2s infinite;
    }

    @keyframes ripple-grow {
      0% { transform: scale(0.3); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .connected-tag {
      margin-top: 4px;
      background: #00FF66;
      color: #000;
      font-weight: 800;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* Surrounding Muted Tower Marker */
    .muted-marker {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .muted-core {
      width: 24px;
      height: 24px;
      background: #1e293b;
      border: 2px solid #64748b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* User Location Marker */
    @keyframes user-pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }

    .user-marker-blue {
      width: 22px;
      height: 22px;
      background: var(--user-blue);
      border: 3px solid #ffffff;
      border-radius: 50%;
      animation: user-pulse 2s infinite;
    }

    /* Floating Control Button */
    .fab-column {
      position: absolute;
      bottom: 24px;
      right: 14px;
      z-index: 999;
    }

    .fab {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.5);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- Fixed Readable Top Panel Overlay -->
    <div class="top-panel-container">
      <div class="top-panel">
        <div class="brand-row">
          <div class="brand-title">
            <span>📶 Cell Tower Finder</span>
          </div>
          <span id="towerCountLabel" style="color: #94a3b8; font-size:12px;">20 sites nearby</span>
        </div>

        <div class="cell-input-row">
          <input
            type="text"
            id="connectedCellInput"
            class="cell-input"
            value="1849201"
            placeholder="Cell ID..."
          />
          <button id="btnAutoConnect" class="btn-quick">Auto-Nearest</button>
        </div>

        <div class="status-strip">
          <div id="connectionStatus" class="status-badge">
            <span class="dot-pulse"></span>
            <span>CONNECTED: Telecom Global 5G (ID: 1849201)</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Recenter Floating Action Button -->
    <div class="fab-column">
      <button id="btnRecenter" class="fab" title="Recenter Location">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg>
      </button>
    </div>
  </div>

  <script>
    let map, userMarker, userAccCircle, connectedLine;
    let towerMarkers = [];
    let allTowers = [];
    let connectedCellId = '1849201';
    let userCoords = { lat: 17.2326, lon: 78.5899 };

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function initMap() {
      // Create Map
      map = L.map('map', { zoomControl: false }).setView([userCoords.lat, userCoords.lon], 16);

      // Standard Free OpenStreetMap Tiles (No API key needed!)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // User Marker
      const userIcon = L.divIcon({
        className: '',
        html: '<div class="user-marker-blue"></div>',
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      });

      userMarker = L.marker([userCoords.lat, userCoords.lon], { icon: userIcon }).addTo(map);
      userAccCircle = L.circle([userCoords.lat, userCoords.lon], {
        radius: 35,
        color: '#0284c7',
        fillColor: '#38bdf8',
        fillOpacity: 0.15
      }).addTo(map);

      setTimeout(() => { map.invalidateSize(); }, 300);

      setupGeolocation();
      loadMockTowers();
    }

    function setupGeolocation() {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(onPosSuccess, null, { enableHighAccuracy: true });
        navigator.geolocation.watchPosition(onPosSuccess, null, { enableHighAccuracy: true });
      }
    }

    function onPosSuccess(pos) {
      userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      userMarker.setLatLng([userCoords.lat, userCoords.lon]);
      userAccCircle.setLatLng([userCoords.lat, userCoords.lon]);
      updateTowerDistances();
    }

    function createTowerIcon(isConnected) {
      if (isConnected) {
        return L.divIcon({
          className: '',
          html: `
            <div class="connected-marker">
              <div class="ripple-ring"></div>
              <div class="connected-core">📡</div>
              <div class="connected-tag">CONNECTED</div>
            </div>
          `,
          iconSize: [100, 50],
          iconAnchor: [50, 20]
        });
      } else {
        return L.divIcon({
          className: '',
          html: `<div class="muted-marker"><div class="muted-core">📡</div></div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });
      }
    }

    function renderTowerMarkers() {
      towerMarkers.forEach(m => map.removeLayer(m));
      towerMarkers = [];
      if (connectedLine) {
        map.removeLayer(connectedLine);
        connectedLine = null;
      }

      let connectedTower = allTowers.find(t => String(t.cellid) === String(connectedCellId).trim());

      allTowers.forEach(t => {
        const isConnected = connectedTower && (t.id === connectedTower.id);
        const icon = createTowerIcon(isConnected);
        const marker = L.marker([t.lat, t.lon], { icon }).addTo(map);

        marker.bindPopup(`<b>${t.carrier}</b><br>Cell ID: ${t.cellid}<br>Distance: ${t.distanceMeters} m`);
        towerMarkers.push(marker);
      });

      const statusEl = document.getElementById('connectionStatus');
      if (connectedTower) {
        statusEl.innerHTML = `
          <span class="dot-pulse"></span>
          <span>CONNECTED: ${connectedTower.carrier} (ID: ${connectedTower.cellid})</span>
        `;

        connectedLine = L.polyline([[userCoords.lat, userCoords.lon], [connectedTower.lat, connectedTower.lon]], {
          color: '#00FF66',
          weight: 3,
          dashArray: '5, 5'
        }).addTo(map);
      } else {
        statusEl.innerHTML = `<span>Searching for matching Cell ID...</span>`;
      }
    }

    function updateTowerDistances() {
      allTowers.forEach(t => {
        t.distanceMeters = getDistance(userCoords.lat, userCoords.lon, t.lat, t.lon);
      });
      allTowers.sort((a, b) => a.distanceMeters - b.distanceMeters);
      renderTowerMarkers();
    }

    function loadMockTowers() {
      const carriers = ['Telecom Global 5G', 'Jio 5G', 'Airtel 5G'];
      allTowers = [];

      for (let i = 0; i < 15; i++) {
        const distKm = 0.12 + (i * 0.18);
        const angle = (i * 120 * Math.PI) / 180;
        const dLat = (distKm / 111) * Math.cos(angle);
        const dLon = (distKm / (111 * Math.cos(userCoords.lat * Math.PI / 180))) * Math.sin(angle);
        const cellid = i === 0 ? 1849201 : (1849202 + i * 15);

        allTowers.push({
          id: 'tower-' + cellid,
          lat: userCoords.lat + dLat,
          lon: userCoords.lon + dLon,
          carrier: carriers[i % carriers.length],
          cellid: cellid,
          distanceMeters: Math.round(distKm * 1000)
        });
      }

      updateTowerDistances();
    }

    document.getElementById('connectedCellInput').addEventListener('input', (e) => {
      connectedCellId = e.target.value;
      renderTowerMarkers();
    });

    document.getElementById('btnAutoConnect').addEventListener('click', () => {
      if (allTowers.length > 0) {
        connectedCellId = String(allTowers[0].cellid);
        document.getElementById('connectedCellInput').value = connectedCellId;
        renderTowerMarkers();
        map.panTo([allTowers[0].lat, allTowers[0].lon], { animate: true });
      }
    });

    document.getElementById('btnRecenter').addEventListener('click', () => {
      map.panTo([userCoords.lat, userCoords.lon], { animate: true });
    });

    window.onload = initMap;
  </script>
</body>
</html>
