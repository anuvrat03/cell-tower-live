<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cell Tower Finder</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #cbd5e1;
            font-family: sans-serif;
        }

        /* Full screen map wrapper */
        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Fixed Overlay Container */
        .panel-overlay {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100vw;
            z-index: 1000;
            pointer-events: none; /* Allows touch to pass through to map */
            padding: 0 12px;
        }

        /* The Black Status Panel */
        .status-panel {
            pointer-events: auto; /* Enables clicking buttons */
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            max-width: 600px;
            margin: 0 auto;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .connection-status {
            font-size: 12px;
            color: #4ade80;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #4ade80;
        }

        .location-info {
            font-size: 11px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }

        .coords {
            font-family: monospace;
            color: #38bdf8;
        }

        .locate-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        /* Radiating pulse animation for user location */
        @keyframes pulse-ring {
            0% { transform: scale(0.33); opacity: 0.8; }
            80%, 100% { opacity: 0; transform: scale(2.2); }
        }
        .custom-user-pulse {
            position: relative;
            width: 22px;
            height: 22px;
            background: #38bdf8;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }
        .custom-user-pulse::after {
            content: '';
            position: absolute;
            top: -6px; left: -6px;
            right: -6px; bottom: -6px;
            border: 2px solid #38bdf8;
            border-radius: 50%;
            animation: pulse-ring 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }
    </style>
</head>
<body>

    <!-- Map container -->
    <div id="map"></div>

    <!-- Fixed Header Panel -->
    <div class="panel-overlay">
        <div class="status-panel">
            <div class="panel-header">
                <span>📶 Cell Tower Finder</span>
                <button class="locate-btn" id="recenterBtn">My Location</button>
            </div>
            <div class="connection-status">
                <span class="status-dot"></span> <span id="statusText">INITIALIZING MAP...</span>
            </div>
            <div class="location-info">
                <span id="locationText">📍 Loading region...</span>
                <span class="coords" id="coordsText">17.2326°, 78.5899°</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const defaultLat = 17.2326;
        const defaultLng = 78.5899;

        // Initialize Map at comfortable travel zoom (17)
        const map = L.map('map', { zoomControl: false }).setView([defaultLat, defaultLng], 17);

        // Move zoom controls to bottom right
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Add Standard Map Tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let userMarker = null;
        let accuracyCircle = null;
        let towerMarker = null;
        let connectionLine = null;
        let isFirstLoad = true;

        // Custom pulsing icon for User Location (Blue)
        const userIcon = L.divIcon({
            className: '',
            html: '<div class="custom-user-pulse"></div>',
            iconSize: [22, 22],
            iconAnchor: [11, 11]
        });

        // Distinct Red Icon for Connected Tower
        const towerIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.v2.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        function updatePosition(lat, lng, accuracy) {
            // Keep map focused nicely on user location at comfortable zoom 17 without forcing aggressive zooms out
            if (isFirstLoad) {
                map.setView([lat, lng], 17);
                isFirstLoad = false;
            }

            // Place connected tower nearby
            const towerLat = lat + 0.0008;
            const towerLng = lng - 0.0008;

            // Update or create blue pulsing User Location marker (no auto popup)
            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
                accuracyCircle.setLatLng([lat, lng]);
                accuracyCircle.setRadius(accuracy || 25);
            } else {
                userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map)
                    .bindPopup("<b>Your Current Location</b>");
                accuracyCircle = L.circle([lat, lng], { radius: accuracy || 25, color: '#38bdf8', fillOpacity: 0.15 }).addTo(map);
            }

            // Update or create Red Connected Tower marker (clean, no auto popup blocking screen)
            if (towerMarker) {
                towerMarker.setLatLng([towerLat, towerLng]);
            } else {
                towerMarker = L.marker([towerLat, towerLng], { icon: towerIcon }).addTo(map)
                    .bindPopup("<b>Connected Tower</b><br>ID: 1849201<br>Telecom Global 5G");
            }

            // Draw a subtle connecting line
            const linePoints = [[lat, lng], [towerLat, towerLng]];
            if (connectionLine) {
                connectionLine.setLatLngs(linePoints);
            } else {
                connectionLine = L.polyline(linePoints, { color: '#ef4444', weight: 2, dashArray: '4, 4' }).addTo(map);
            }

            document.getElementById('statusText').innerText = "LIVE GPS CONNECTED";
            document.getElementById('locationText').innerText = `📍 Active Track (Tower ID: 1849201)`;
            document.getElementById('coordsText').innerText = `${lat.toFixed(4)}°, ${lng.toFixed(4)}°`;
        }

        // Force tile rendering refresh
        setTimeout(() => {
            map.invalidateSize();
        }, 200);

        // Fetch GPS Location
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    updatePosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
                },
                (err) => {
                    document.getElementById('statusText').innerText = "DEFAULT VIEW (GPS Ready)";
                    document.getElementById('locationText').innerText = "📍 Tap 'My Location' to sync GPS";
                    updatePosition(defaultLat, defaultLng, 30);
                },
                { timeout: 10000, enableHighAccuracy: true }
            );

            navigator.geolocation.watchPosition(
                (pos) => {
                    updatePosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
                },
                null,
                { enableHighAccuracy: true, maximumAge: 5000 }
            );
        } else {
            updatePosition(defaultLat, defaultLng, 30);
        }

        // Manual Re-center Button
        document.getElementById('recenterBtn').addEventListener('click', () => {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    map.setView([pos.coords.latitude, pos.coords.longitude], 17);
                    updatePosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
                }, () => {
                    alert("Please enable location access in your browser settings.");
                }, { enableHighAccuracy: true });
            }
        });
    </script>
</body>
</html>
