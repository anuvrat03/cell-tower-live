<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cell Tower Finder</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
        }

        /* Map fills the screen completely */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay container lets touch/zoom pass through to the map */
        .panel-overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            pointer-events: none;
            padding: 12px;
        }

        /* Fixed Black Header Panel */
        .status-panel {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 10px 14px;
            color: #ffffff;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            max-width: 600px;
            margin: 0 auto;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .connection-status {
            font-size: 11px;
            color: #4ade80;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px #4ade80;
        }

        .location-info {
            font-size: 11px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
        }

        .coords {
            font-family: monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 1px 6px;
            border-radius: 4px;
            color: #38bdf8;
        }

        .locate-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .locate-btn:active {
            background: #334155;
        }
    </style>
</head>
<body>

    <!-- Map Area -->
    <div id="map"></div>

    <!-- Fixed Top Panel -->
    <div class="panel-overlay-container">
        <div class="status-panel">
            <div class="panel-header">
                <span>📶 Cell Tower Finder</span>
                <button class="locate-btn" id="recenterBtn">My Location</button>
            </div>
            <div class="connection-status">
                <span class="status-dot"></span> <span id="statusText">REQUESTING GPS PERMISSION...</span>
            </div>
            <div class="location-info">
                <span id="locationText">📍 Waiting for satellite lock...</span>
                <span class="coords" id="coordsText">--.----°, --.----°</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Default starting view (fallback if GPS is disabled)
        const map = L.map('map', { zoomControl: false }).setValue = 17;
        map.setView([17.2326, 78.5899], 17); // Initial target scale set for comfort

        // Place zoom controls at bottom right so they don't overlap the header
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let userMarker = null;
        let accuracyRadius = null;
        let hasCenteredOnce = false;

        function updateMapLocation(lat, lng, accuracy) {
            // Set comfortable travel scale zoom level (17)
            if (!hasCenteredOnce) {
                map.setView([lat, lng], 17);
                hasCenteredOnce = true;
            }

            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
                accuracyRadius.setLatLng([lat, lng]);
                accuracyRadius.setRadius(accuracy || 25);
            } else {
                userMarker = L.marker([lat, lng]).addTo(map)
                    .bindPopup("<b>You are here</b>").openPopup();
                accuracyRadius = L.circle([lat, lng], { 
                    radius: accuracy || 25, 
                    color: '#38bdf8', 
                    fillColor: '#38bdf8', 
                    fillOpacity: 0.2 
                }).addTo(map);
            }

            // Update UI text
            document.getElementById('statusText').innerText = "LIVE GPS CONNECTED";
            document.getElementById('locationText').innerText = `📍 Travel Mode Active (~${Math.round(accuracy || 0)}m accuracy)`;
            document.getElementById('coordsText').innerText = `${lat.toFixed(4)}°, ${lng.toFixed(4)}°`;
        }

        // Trigger Live Geolocation Tracking
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    updateMapLocation(
                        position.coords.latitude, 
                        position.coords.longitude, 
                        position.coords.accuracy
                    );
                },
                (error) => {
                    console.warn("GPS Error:", error.message);
                    document.getElementById('statusText').innerText = "GPS BLOCKED / UNAVAILABLE";
                    document.getElementById('locationText').innerText = "📍 Check browser location settings";
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 5000,
                    timeout: 10000
                }
            );
        } else {
            document.getElementById('statusText').innerText = "GPS NOT SUPPORTED";
        }

        // Manual Re-center Button
        document.getElementById('recenterBtn').addEventListener('click', () => {
            navigator.geolocation.getCurrentPosition((position) => {
                map.setView([position.coords.latitude, position.coords.longitude], 17);
                updateMapLocation(position.coords.latitude, position.coords.longitude, position.coords.accuracy);
            }, () => {
                alert("Unable to fetch current location. Please check phone GPS permissions.");
            }, { enableHighAccuracy: true });
        });
    </script>
</body>
</html>
